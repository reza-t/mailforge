[tool.pytest.ini_options]
pythonpath = ["worker"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"worker/mailforge/llm/anthropic_sdk.py" = ["E501"]  # prompt strings
