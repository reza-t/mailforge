services:
  mailforge-worker:
    build:
      context: ./worker
      args:
        INSTALL_CLAUDE_CLI: "false"   # set "true" if llm_backend: "cli"
    image: mailforge-worker:local
    container_name: mailforge-worker
    command: ["sleep", "infinity"]    # Ofelia execs the job inside this container
    user: "${MAILFORGE_UID:-1000}:${MAILFORGE_GID:-1000}"   # must own ./data and ./reports
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./reports:/app/reports
    labels:
      ofelia.enabled: "true"
      # sec min hour dom mon dow -> every day 07:30 (container TZ)
      ofelia.job-exec.mailforge-daily.schedule: "0 30 7 * * *"
      ofelia.job-exec.mailforge-daily.command: "python -m mailforge.main"
    restart: unless-stopped

  ofelia:
    image: mcuadros/ofelia:latest
    command: daemon --docker
    depends_on: [mailforge-worker]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # required by Ofelia; see README security notes
    restart: unless-stopped
